# Nightly bounded fuzzing: the UCI protocol AND the search itself.
#
# The parity workflow's golden transcripts exercise the WELL-FORMED subset of the
# UCI grammar; the `fuzz` job drives the ASan+UBSan engine with seeded pseudo-random
# command streams -- boundary values, truncated and mangled lines, binary junk --
# weighted toward almost-valid input, which is where a parser actually dies. Every
# stream must end with a clean exit and a silent sanitizer (tools/uci_fuzz.py owns
# the contract, including the CRITICAL ERROR exit-1 path). The first session of
# this harness found two real shell defects before this lane ever ran in CI: the
# critical-error exit leaked the worker set, and `bench 1 1 2` died on an empty
# filename where the golden searches 9009 nodes.
#
# `fuzz` never reaches the search below the parser -- a mutation that gets past
# `position`/`go` parsing is already a well-formed command. The `fuzz-search` job
# is the complement: no shell, no UCI text, tools/fuzz_search.c calls search_go
# directly under libFuzzer, so a mutation's whole budget goes at movegen, the move
# picker, the TT, pruning, qsearch and the NNUE accumulator push/pop. See
# docs/00-architecture.md#what-the-library-boundary-buys for why linking the
# engine with no shell object makes this possible at all.
name: mcfish fuzz (nightly)

on:
  schedule:
    # 04:31 UTC daily -- off the hour to dodge the scheduler's peak.
    - cron: "31 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Same pinned toolchain as the parity workflow; see the rationale there.
  CLANG_VERSION: "22"

jobs:
  fuzz:
    name: Bounded UCI fuzz (ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same forcing as the parity workflow's sanitizers job: abort on the first
      # ASan error, halt on the first UBSan report (build.sh's debug flags do not
      # include -fno-sanitize-recover), and print stacks so the log names the
      # line, not just the failure. The harness also greps stderr, so a report
      # fails the stream even where the process manages to exit 0.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stacktrace=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uci_fuzz.py parses on the runner's 3.12 today, but it is covered by the
      # same requires-python >= 3.14 floor and the same py314 formatter, so it is
      # one reformat away from the SyntaxError that took out the upstream-check
      # gate. Provision the declared floor rather than rely on the file happening
      # not to use 3.14 syntax yet.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          "clang-$CLANG_VERSION" --version

      # The engine loads the net at startup, so the fuzzed binary needs it in
      # resources/ like every other engine-running lane (same cache key as the
      # parity workflow -- a net bump busts it, nothing else does).
      - name: Cache NNUE network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/nn-*.nnue
          key: nnue-${{ hashFiles('src/engine/eval/nnue/network.h') }}
      - name: Fetch the NNUE net
        run: ./build.sh net-fetch

      - name: Build the ASan+UBSan engine
        run: CC="clang-$CLANG_VERSION" ./build.sh debug

      # ~15 min of streams. The seed defaults to the wall clock, so each night
      # walks a fresh region of the input space, and the harness prints the seed
      # FIRST -- a red run names its own one-flag reproducer at the top of the
      # log. Run from resources/ so the engine finds the net.
      - name: Fuzz (bounded, ~15 min)
        run: |
          set -euo pipefail
          cd resources
          python3 ../tools/uci_fuzz.py --seconds 900

  fuzz-search:
    name: In-process search fuzz (libFuzzer+ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same forcing as the `fuzz` job above; libFuzzer's own crash report is
      # separate from these but both sanitizers are linked in alongside it.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stacktrace=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          "clang-$CLANG_VERSION" --version

      # Best-effort: eval_nnue_load leaves the classical fallback in place when
      # this is absent, so a cache miss degrades coverage rather than failing the
      # job. Same cache key as the `fuzz` job and the parity workflow.
      - name: Cache NNUE network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/nn-*.nnue
          key: nnue-${{ hashFiles('src/engine/eval/nnue/network.h') }}
      - name: Fetch the NNUE net
        run: ./build.sh net-fetch

      # tools/fuzz_search.c reads resources/ as a path relative to the repo root
      # (the same literal tests/test_main.c uses), so this runs from the
      # checkout root, unlike the `fuzz` job's `cd resources`.
      - name: Fuzz the search (bounded, 10 min)
        run: CC="clang-$CLANG_VERSION" ./build.sh fuzz-search 600

  fuzz-tb:
    name: Syzygy parse fuzz (libFuzzer+ASan+UBSan)
    runs-on: ubuntu-latest
    # Two lanes at 10 minutes each, plus two sanitizer builds of the engine.
    timeout-minutes: 40
    env:
      # Same forcing as the two jobs above.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stacktrace=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          "clang-$CLANG_VERSION" --version

      # Best-effort, and it seeds only the whole-file lane: with the 3-man set
      # present that lane mutates tables that PARSE, which is where a parser
      # dies; without it the lane still runs, from an empty corpus, and says so
      # in red. A mirror outage must not fail a fuzz job, so this never gates.
      # The decoder lane needs nothing either way -- it builds every table it
      # parses out of the fuzzer's own bytes.
      - name: Fetch the 3-man tables to seed the whole-file lane
        continue-on-error: true
        run: ./build.sh tb-fetch

      # Both lanes, 10 minutes EACH: they cover different code (the decoder
      # directly vs. registry.c set, set_groups, set_dtz_map and map_file) at
      # throughputs three orders of magnitude apart, so one budget for both would
      # be a budget for the fast one.
      - name: Fuzz the Syzygy parse (bounded, 10 min per lane)
        run: CC="clang-$CLANG_VERSION" ./build.sh fuzz-tb 600
