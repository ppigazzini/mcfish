# Scheduled upstream-sync detection, map health, and node-level fidelity.
#
# Three jobs, the first two named as zfish names its equivalent lane. The GATING
# half (`upstream-check`) clones the golden at the pin and runs
# `./build.sh upstream-map` -- the declared-vs-derived audit (ROT and DRIFT both
# fail) plus the uncovered-surface ratchet -- which the parity workflow cannot
# run because a CI checkout of origin does not carry the pinned upstream tree.
# The DETECTION half is judgment-free: count how many commits upstream master is
# ahead of tools/upstream/UPSTREAM_BASE and preview the per-owner worklist, so a
# divergence cannot silently bundle up between sessions. Porting stays a
# deliberate, human-gated session -- this job only detects, it never attempts a
# port.
#
# `upstream-nodes` and `golden-audit` are a different question from either: not
# "has upstream moved" but "is mcfish still faithful to the pin it already claims
# to match."
# tools/upstream_nodes.py's random-legal-move positions appear in no bench list,
# no golden and no test, so this is the strongest fidelity probe this tree has
# -- and until this job existed it only ran when someone remembered to run it
# locally.
name: mcfish upstream check

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Upstream master moves a few commits a week, and
    # weekly detection is cheap insurance against a bench or net change slipping
    # through unnoticed. The node differential moves at the same cadence: the
    # pin it tests against only changes in a deliberate resync session.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Least privilege: the job reads this repository and upstream history.
permissions:
  contents: read

env:
  # Same pinned toolchain as the parity and fuzz workflows.
  CLANG_VERSION: "22"

jobs:
  upstream-check:
    name: Map audit + upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pyproject pins requires-python >= 3.14 and ruff's target-version to py314,
      # and the formatter EMITS 3.14-only syntax accordingly -- it rewrites
      # `except (A, B):` to PEP 758's `except A, B:`. ubuntu-latest still ships
      # 3.12, where that is a SyntaxError, so without this step upstream_map.py
      # could not be parsed and the audit below died before it checked anything.
      # A gate that cannot run is not a gate. Keep this in step with
      # requires-python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # upstream_map.py resolves the pin from this repo's objects or a sibling
      # ../Stockfish checkout; CI has neither, so clone the golden full-history
      # beside the workspace (the pin may be well behind master).
      - name: Clone the golden beside the workspace
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git ../Stockfish

      # The audit holds tools/upstream_map.tsv to the citation-derived reality;
      # the ratchet holds the uncovered upstream surface at
      # tools/upstream_map.baseline. Both are gates: red here means the declared
      # map rotted or new unported surface appeared, and the fix is a map or
      # citation edit in a normal session -- never editing the baseline upward.
      - name: Declared-map audit + uncovered ratchet
        run: ./build.sh upstream-map

      # Informational from here down: name the gap, never fail on it.
      - name: Report upstream drift and the re-port worklist
        run: |
          set -euo pipefail
          pin="$(cat tools/upstream/UPSTREAM_BASE)"
          master="$(git -C ../Stockfish rev-parse origin/master)"
          behind="$(git -C ../Stockfish rev-list --count "$pin..$master")"
          echo "pin $pin is $behind commits behind upstream master $master"
          {
            echo "## Upstream drift"
            echo ""
            echo "\`$pin\` is **$behind** commits behind \`master\` (\`${master:0:12}\`)."
            echo ""
            if [ "$behind" -gt 0 ]; then
              echo '```'
              python3 tools/resync_worklist.py "$master"
              echo '```'
              echo ""
            fi
            echo "Porting is human-gated: advance the pin in a normal session," \
                 "with tools/resync_worklist.py as the plan."
          } >> "$GITHUB_STEP_SUMMARY"

  upstream-nodes:
    name: Node-for-node differential (random positions)
    runs-on: ubuntu-latest
    # Raised from 20: this job now also adjudicates the goldens (which drives the
    # oracle with a settle after every `go`) and runs two callgrind profiles. The
    # fingerprint alone measures 77s on a developer box and a runner is slower.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          "clang-$CLANG_VERSION" --version

      # Same cache key as the parity and fuzz workflows -- a net bump busts it,
      # nothing else does.
      - name: Cache NNUE network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/nn-*.nnue
          key: nnue-${{ hashFiles('src/engine/eval/nnue/network.h') }}
      - name: Fetch the NNUE net
        run: ./build.sh net-fetch

      - name: Build mcfish
        run: CC="clang-$CLANG_VERSION" ./build.sh build

      # Full history: upstream_oracle.sh checks out an arbitrary pinned sha into
      # a detached worktree, which a shallow clone cannot do.
      - name: Clone the golden beside the workspace
        run: git clone https://github.com/official-stockfish/Stockfish.git ../Stockfish

      # Builds with the golden's OWN Makefile and default compiler -- deliberately
      # not clang-22 -- at tools/upstream/UPSTREAM_BASE. See upstream_oracle.sh's
      # own header for why pristine matters: a shared bug would otherwise cancel
      # out on both sides and pass.
      - name: Build the pristine upstream oracle at the pin
        run: bash tools/upstream/upstream_oracle.sh

      # Fresh positions every run, rather than the script's own fixed default
      # seed (meant for reproducible LOCAL debugging) -- the same reason the
      # nightly UCI fuzz job seeds from the wall clock. net_identity_or_die
      # refuses the comparison outright if the net-fetch or oracle-build steps
      # above produced a mismatch; a red run here names which side is wrong
      # before printing a single node count.
      - name: Node-for-node differential (random positions)
        run: ./build.sh upstream-nodes --positions 40 --depth 10 --seed "$(date +%s)"

      # The oracle is already built and the net already fetched, so adjudicating
      # the goldens costs one more drive of eight short scripts. It is the only
      # thing that can tell an oracle-derived golden from a photograph of mcfish,
      # and `./build.sh golden-update` produces the latter -- so without this lane
      # a resync converts them back and nothing notices. It found a real `go perft`
      # divergence on its first run. LOCAL otherwise: it needs the pinned upstream
      # tree, which the blocking parity workflow's checkout does not carry.
      - name: Adjudicate the UCI goldens against the oracle
        run: CC="clang-$CLANG_VERSION" ./build.sh golden-audit

      # THE FINISH LINE, and until now it ran in no lane at all. `upstream-parity`
      # benches mcfish against the pristine oracle built two steps up -- the whole
      # claim of this port in one number -- and it was local-only because it needs
      # that oracle. This job already has it, so the cost is one more bench.
      - name: Bench against the pristine oracle (the finish line)
        run: CC="clang-$CLANG_VERSION" ./build.sh upstream-parity

      # Whole-transcript diff, both engines driven live on this runner. It covers
      # what the node differential cannot see -- the UCI surface itself, including
      # the `stop` and `ponderhit` cases -- and it too ran in no lane before this.
      - name: Whole-transcript diff vs the oracle
        run: CC="clang-$CLANG_VERSION" ./build.sh upstream-transcript

      # Reports, never gates: upstream moving is normal and the failure this catches
      # is not NOTICING. It reads the pin in both directions, and a checkout sitting
      # BEFORE the pin is the one direction that is a workspace defect.
      - name: Pin status, both directions
        run: ./build.sh sync-status || true

      # DOES gate, unlike the step above: a stale AUTHORS is a licence defect rather
      # than news about upstream. It runs in `parity` too, where it NARROWS to
      # unchecked without the golden -- this lane already clones it, so here it is the
      # real comparison. Six names had gone missing across four syncs before it
      # existed, because a resync reads `src/` and a commit touching AUTHORS and
      # search.cpp together loses the half that is not code.
      - name: AUTHORS is still upstream's, verbatim
        run: ./build.sh attribution

      # The ALGORITHM gate, and the only one here that is not about values. Every
      # other differential passes over a state divergence that happens not to move a
      # node count on the positions it drives; this one found two that all of them
      # missed. callgrind is deterministic, so a loaded runner cannot flap it -- but
      # it is ~50x slow, which is why it runs here and not in the blocking lane.
      # CC is NOT optional here: this step BUILDS mcfish (at sse41, to match the
      # tier the oracle builds and the only tier callgrind can run), and build.sh
      # defaults to plain `clang`, which on this runner is not the pinned major the
      # rest of the lane uses. Every other build step in these workflows passes it
      # explicitly for the same reason.
      - name: Call-count fingerprint vs the oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          CC="clang-$CLANG_VERSION" ./build.sh fingerprint
